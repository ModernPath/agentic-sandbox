# Sandbox host with its database. Copy instances/<client>.env to .env (or use env_file) first.
# Only the host port is published, on loopback. The database is not published.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:?Set SANDBOX_DB_PASSWORD in .env}
      POSTGRES_DB: sandbox
    volumes:
      - sandbox_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  host:
    build:
      context: .
      dockerfile: Dockerfile.host
    env_file:
      - path: ${SANDBOX_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sandbox:${SANDBOX_DB_PASSWORD:?Set SANDBOX_DB_PASSWORD in .env}@db:5432/sandbox
      SANDBOX_HOST: 0.0.0.0
      SANDBOX_COOKIE_SECURE: ${SANDBOX_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-8100}:8100"
    restart: unless-stopped

volumes:
  sandbox_db:
