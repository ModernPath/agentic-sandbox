<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research brief</title>
  <style>
    :root { color-scheme: light dark; --fg:#17233a; --bg:#f4f7fb; --card:#fff; --muted:#5b6b82; --accent:#1d4ed8; --err:#b42318; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fg:#e6edf7; --bg:#0f172a; --card:#162238; --muted:#9fb0c7; --accent:#7aa2ff; --err:#ff8a80; } }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); }
    main { max-width:860px; margin:0 auto; padding:24px 16px; }
    a.back { color:var(--accent); text-decoration:none; font-weight:600; }
    h1 { font-size:22px; margin:12px 0 4px; } .subtle { color:var(--muted); margin:0 0 16px; }
    form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    input[type=text] { flex:1 1 280px; padding:10px; font:inherit; border:1px solid #8a97ab; border-radius:8px; background:var(--card); color:var(--fg); }
    button { padding:10px 16px; font:inherit; font-weight:600; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.6; cursor:progress; }
    button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .panel { background:var(--card); border-radius:10px; padding:16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
    .panel h2 { font-size:17px; margin:0 0 8px; }
    .summary { white-space:pre-wrap; }
    ol { padding-left:20px; } li a { color:var(--accent); }
    .error { color:var(--err); font-weight:600; }
    .history button { background:none; color:var(--accent); padding:6px 0; text-align:left; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← All agents</a>
    <h1>Research brief</h1>
    <p class="subtle">Searches the web, reads a few pages, and writes a summary. Check every citation before use.</p>

    <form id="brief-form">
      <label for="topic" class="subtle">Topic</label>
      <input type="text" id="topic" name="topic" maxlength="300" required placeholder="e.g. solar storage costs in 2026">
      <button type="submit" id="submit">Write brief</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>

    <section class="panel" id="result" hidden>
      <h2 id="result-topic"></h2>
      <p class="summary" id="result-summary"></p>
      <h3>Sources</h3>
      <ol id="result-sources"></ol>
      <p id="result-reason" class="subtle"></p>
    </section>

    <section class="panel history">
      <h2>Recent briefs</h2>
      <ul id="history"></ul>
    </section>
  </main>
  <script>
    (function () {
      var API = '/api/agents/research-brief/briefs';
      var form = document.getElementById('brief-form');
      var topic = document.getElementById('topic');
      var submit = document.getElementById('submit');
      var message = document.getElementById('message');
      var result = document.getElementById('result');

      function setMessage(text, isError) {
        message.textContent = text || '';
        message.className = isError ? 'error' : '';
      }

      function errorText(response) {
        return response.json().then(function (body) {
          return body.error || body.detail || ('Request failed (' + response.status + ')');
        }, function () {
          return 'Request failed (' + response.status + ')';
        });
      }

      function showBrief(brief) {
        result.hidden = false;
        document.getElementById('result-topic').textContent = brief.topic;
        document.getElementById('result-summary').textContent = brief.summary || '';
        document.getElementById('result-reason').textContent = brief.reason || '';
        var list = document.getElementById('result-sources');
        list.textContent = '';
        brief.sources.forEach(function (source) {
          var item = document.createElement('li');
          item.textContent = '[' + source.number + '] ' + source.title + ' ';
          if (/^https?:\/\//i.test(source.url)) {
            var link = document.createElement('a');
            link.href = source.url;
            link.rel = 'noopener noreferrer';
            link.target = '_blank';
            link.textContent = source.url;
            item.appendChild(link);
          } else {
            item.appendChild(document.createTextNode(source.url));
          }
          list.appendChild(item);
        });
      }

      function loadHistory() {
        return fetch(API).then(function (r) {
          if (!r.ok) return errorText(r).then(function (t) { throw new Error(t); });
          return r.json();
        }).then(function (body) {
          var history = document.getElementById('history');
          history.textContent = '';
          body.briefs.forEach(function (brief) {
            var item = document.createElement('li');
            var button = document.createElement('button');
            button.type = 'button';
            button.textContent = brief.topic + ' · ' + brief.created_at.slice(0, 16).replace('T', ' ');
            button.addEventListener('click', function () {
              fetch(API + '/' + encodeURIComponent(brief.id)).then(function (r) { return r.json(); }).then(showBrief);
            });
            item.appendChild(button);
            history.appendChild(item);
          });
        }).catch(function (error) {
          setMessage(error.message || 'Could not load history.', true);
        });
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var value = topic.value.trim();
        if (!value) { setMessage('Enter a topic.', true); return; }
        submit.disabled = true;
        setMessage('Writing brief… this can take a minute.');
        fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Sandbox-Request': '1' },
          body: JSON.stringify({ topic: value })
        }).then(function (response) {
          if (!response.ok) return errorText(response).then(function (t) { throw new Error(t); });
          return response.json();
        }).then(function (brief) {
          setMessage('Brief saved.');
          showBrief(brief);
          return loadHistory();
        }).catch(function (error) {
          setMessage(error.message || 'Could not write the brief.', true);
        }).finally(function () {
          submit.disabled = false;
        });
      });

      loadHistory();
    })();
  </script>
</body>
</html>
