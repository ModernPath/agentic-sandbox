<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Agentic Sandbox</title>
  <style>
    :root { color-scheme: light dark; --fg:#17233a; --bg:#f4f7fb; --card:#fff; --muted:#5b6b82; --accent:#1d4ed8; --err:#b42318; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fg:#e6edf7; --bg:#0f172a; --card:#162238; --muted:#9fb0c7; --accent:#7aa2ff; --err:#ff8a80; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); }
    main { width:min(360px, calc(100vw - 32px)); background:var(--card); border-radius:12px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
    h1 { font-size:20px; margin:0 0 16px; }
    label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
    input { width:100%; box-sizing:border-box; padding:10px; font:inherit; border:1px solid #8a97ab; border-radius:8px; background:var(--bg); color:var(--fg); }
    button { margin-top:18px; width:100%; padding:10px; font:inherit; font-weight:600; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.6; }
    button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    #message { min-height:1.5em; margin:12px 0 0; color:var(--err); font-weight:600; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required maxlength="100">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1000">
      <button type="submit" id="submit">Sign in</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var message = document.getElementById('message');
      var submit = document.getElementById('submit');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        submit.disabled = true;
        message.textContent = '';
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Sandbox-Request': '1' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        }).then(function (response) {
          return response.json().then(function (body) {
            if (!response.ok) throw new Error(body.error || 'Sign-in failed');
            var next = new URLSearchParams(window.location.search).get('next') || '/';
            window.location.assign(next.charAt(0) === '/' && next.charAt(1) !== '/' ? next : '/');
          });
        }).catch(function (error) {
          message.textContent = error.message || 'Sign-in failed';
          document.getElementById('password').value = '';
          submit.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
